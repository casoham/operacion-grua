<style>
:root{--navy:#16305a;--ink:#10284d;--blue:#2f9be8;--sky:#d9f1fd;--orange:#f7922b;--red:#e5472e;--green:#27a574;--paper:#ffffff}
*{box-sizing:border-box}
body{margin:0;font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;color:var(--ink);background:linear-gradient(#58bdf0,#bfe8fa);min-height:100vh}
.app{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;max-width:1300px;margin:0 auto;padding:16px;align-items:start}
@media(max-width:980px){.app{grid-template-columns:1fr}}
.stage{position:relative}
canvas{width:100%;height:auto;border:4px solid var(--navy);border-radius:22px;display:block;touch-action:none;background:#4bb5ee;box-shadow:0 6px 0 rgba(22,48,90,.25)}
.fbs{position:absolute;left:12px;right:12px;top:12px;z-index:4;display:none;border:4px solid;border-radius:16px;padding:10px 34px 10px 14px;font-size:14.5px;line-height:1.4;box-shadow:0 5px 0 rgba(22,48,90,.3)}
.fbs.on{display:block}.fbs.bad{background:#ffe9e4;border-color:var(--red)}.fbs.good{background:#e0f7ea;border-color:var(--green)}.fbs.info{background:#fff6dc;border-color:#e0a800}
.fbs .x{position:absolute;right:8px;top:6px;border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--navy)}
.fbs table{border-collapse:collapse;margin:4px 0}.fbs td{padding:0 12px 0 0}
#toast{position:absolute;left:50%;bottom:16px;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:8px 16px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast{z-index:6}
#toast.bad{background:var(--red)}#toast.good{background:var(--green)}
.hint{font-size:13px;color:var(--navy);opacity:.8;margin:8px 4px 0}
.panel{background:var(--paper);border:4px solid var(--navy);border-radius:22px;padding:14px 16px 16px;box-shadow:0 6px 0 rgba(22,48,90,.25)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--blue);margin-bottom:6px}
h1{font-size:22px;margin:0 0 10px;line-height:1.1}
h2{font-size:18px;margin:12px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-weight:600;font-size:13px;border:3px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;padding:3px 9px;cursor:pointer}
.chip.on{background:var(--navy);color:#fff}.chip.ok{background:var(--green);color:#fff;border-color:var(--navy)}
.brief{margin:0 0 8px;font-size:14.5px;line-height:1.35}
.lbl{font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--navy);margin:12px 0 5px;display:flex;justify-content:space-between;align-items:center}
.lbl label{font-weight:500;text-transform:none;letter-spacing:0;font-size:13px}
.queue{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;align-items:center}
.qbox,.pcard .tag{font:inherit;font-weight:700;color:#fff;border:3px solid var(--navy);border-radius:8px;min-width:54px;height:46px;cursor:pointer;text-shadow:0 2px 0 var(--navy);box-shadow:0 3px 0 var(--navy)}
.qbox:active{transform:translateY(2px);box-shadow:0 1px 0 var(--navy)}
.qbox.sel{outline:4px solid #ffd23f;outline-offset:2px}
.c0{background:#2f6fc4}.c1{background:#f7922b}.c2{background:#27a574}.c3{background:#e5472e}
.goal{background:#e9f8ee;border:3px dashed var(--green);border-radius:12px;padding:7px 10px;font-weight:600;margin:10px 0 0}
.ro{font-size:13.5px;background:var(--sky);border-radius:12px;padding:8px 10px;min-height:44px}
.ro table{border-collapse:collapse;width:100%;margin-bottom:6px;font-variant-numeric:tabular-nums}
.ro td,.ro th{padding:1px 4px;text-align:right;border-bottom:1px solid #b6dff4}.ro th{font-size:12px;color:var(--navy)}
.ro b{color:#c25a00}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;background:var(--orange);color:#fff;border:3px solid var(--navy);border-radius:12px;padding:8px 14px;box-shadow:0 3px 0 var(--navy);cursor:pointer;text-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--navy)}
.btn.blue{background:var(--blue)}.btn.ghost{background:#fff;color:var(--navy);text-shadow:none}.btn.green{background:var(--green)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fb{margin-top:12px;border-radius:12px;padding:0;font-size:14px;line-height:1.4}
.fb.bad,.fb.good,.fb.info{padding:10px 12px;border:3px solid}
.fb.bad{background:#ffe9e4;border-color:var(--red)}.fb.good{background:#e0f7ea;border-color:var(--green)}.fb.info{background:#fff6dc;border-color:#e0a800}
.fb table{border-collapse:collapse;margin:4px 0}.fb td{padding:0 8px 0 0}
.pcard{display:flex;gap:10px;align-items:center;border:3px solid var(--navy);border-radius:14px;padding:6px 8px;margin-bottom:8px;background:#fff}
.pcard.sel{outline:4px solid #ffd23f}.pcard svg{flex:none;width:76px;height:64px}.pcard .info{flex:1;font-size:13.5px;line-height:1.25}
.pcard .info b{font-size:14px}
.mini{font:inherit;font-weight:600;font-size:13px;border:3px solid var(--navy);border-radius:10px;background:var(--blue);color:#fff;padding:3px 9px;cursor:pointer}
.mini{margin-top:5px;line-height:1.2}.mini.o{background:var(--orange)}.mini.g{background:#fff;color:var(--navy)}
.calc{border:3px solid var(--blue);border-radius:14px;padding:10px;background:#f2fbff;margin-bottom:8px}
.calc svg{width:100%;height:150px;background:#fff;border-radius:10px;border:2px solid #cbe9f8}
.calc table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
.calc td,.calc th{border-bottom:1px solid #cbe9f8;padding:2px 4px;text-align:right}.calc th{font-size:12px;color:var(--navy)}.calc td:first-child,.calc th:first-child{text-align:left}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text]{font:inherit;width:84px;padding:5px 8px;border:3px solid var(--navy);border-radius:10px;text-align:right}
input.ok{border-color:var(--green);background:#e8f9ef}input.no{border-color:var(--red);background:#ffeeea}
.opt{display:block;border:3px solid var(--navy);border-radius:10px;padding:6px 10px;margin:5px 0;cursor:pointer;font-size:14px;background:#fff;width:100%;text-align:left;font-family:inherit}
.opt.ok{background:#e0f7ea;border-color:var(--green)}.opt.no{background:#ffeeea;border-color:var(--red)}
.locked{opacity:.4;pointer-events:none}
.eq{font-weight:700;font-size:16px;background:var(--sky);border-radius:10px;padding:6px 10px;display:inline-block}
input[type=range]{width:100%;accent-color:var(--orange)}
.modal{position:absolute;inset:0;background:rgba(22,48,90,.6);display:none;align-items:center;justify-content:center;padding:10px;border-radius:22px;z-index:5}
.modal.on{display:flex}
.mcard{background:#fff;border:4px solid var(--navy);border-radius:20px;padding:12px 16px 14px;max-width:600px;width:100%;max-height:100%;overflow:auto;font-size:14.5px;line-height:1.4}
.mcard svg{max-height:170px}.mcard h3{margin:6px 0 4px;font-size:18px}.mcard p{margin:6px 0}
.mhead{display:flex;justify-content:space-between;color:var(--blue);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.dsvg{width:100%;max-height:190px;display:block;margin:4px auto;background:var(--sky);border-radius:12px}

.mono{font-variant-numeric:tabular-nums}

<div class="app">
  <div class="stage">
    <canvas id="c" width="800" height="600" aria-label="Escena del puerto con barco y grúa"></canvas>
    <div id="toast"></div>
    <div class="hud"><div class="pill" id="hudL"></div><div class="pill" id="hudR"></div></div>
    <nav class="dock" id="dock"><button data-act="demo"><i>📖</i>Demo</button><button data-act="mute"><i id="muteI">🔊</i>Sonido</button><button data-act="reset"><i>🔄</i>Reiniciar</button></nav>

<script>
/* =====================================================================
   OPERACIÓN GRÚA · CARGA SEGURA  —  plantilla de prueba v0.1
   Niveles: 1 masas puntuales · 2 figuras compuestas · 3 región bajo una curva
   ===================================================================== */
const $=s=>document.querySelector(s);
const cvs=$('#c'),ctx=cvs.getContext('2d'),panel=$('#panel');
const W=800,H=600,U=48,X0=462,DECK=430,OUT='#4a3426',HOOK_Y=92;
const COLS=[['#2f6fc4','#1c4a96'],['#f7922b','#c8620f'],['#27a574','#17764f'],['#e5472e','#a82b17']];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const fmt=(v,d=2)=>{let s=(+v).toFixed(d);if(/^-0\.?0*$/.test(s))s=s.slice(1);return s.replace('.',',')};
const fmtP=(v,d=2)=>fmt(v,d).replace(',','.');          // con punto (para tablas compactas)
const num=s=>{s=String(s).trim().replace(',','.');const m=s.match(/^(-?[\d.]+)\s*\/\s*([\d.]+)$/);return m?parseFloat(m[1])/parseFloat(m[2]):parseFloat(s)};
const close=(v,t)=>Math.abs(v-t)<=Math.max(0.02,Math.abs(t)*0.015);

/* ---------- Piezas compuestas (Nivel 2) ---------- */
const R=(x,y,w,h,sign,name)=>({sign,name,A:w*h,c:[x+w/2,y+h/2],poly:[[x,y],[x+w,y],[x+w,y+h],[x,y+h]]});
const Tri=(a,b,c,name)=>({sign:1,name,A:Math.abs((b[0]-a[0])*(c[1]-a[1])-(c[0]-a[0])*(b[1]-a[1]))/2,c:[(a[0]+b[0]+c[0])/3,(a[1]+b[1]+c[1])/3],poly:[a,b,c]});
const Circ=(cx,cy,r,sign,name)=>({sign,name,A:Math.PI*r*r,c:[cx,cy],poly:Array.from({length:40},(_,i)=>[cx+r*Math.cos(i/40*2*Math.PI),cy+r*Math.sin(i/40*2*Math.PI)])});
const Semi=(cx,cy,r,name)=>({sign:1,name,A:Math.PI*r*r/2,c:[cx,cy+4*r/(3*Math.PI)],poly:Array.from({length:41},(_,i)=>[cx+r*Math.cos(Math.PI*i/40),cy+r*Math.sin(Math.PI*i/40)])});
function mkPiece(name,ci,parts){
  const pos=parts.filter(p=>p.sign>0).flatMap(p=>p.poly);
  const W=Math.max(...pos.map(p=>p[0])),Hh=Math.max(...pos.map(p=>p[1]));
  const A=parts.reduce((s,p)=>s+p.sign*p.A,0);

/* ---- Nivel 3: placa colgada ---- */
function plateGeom(st){
  const{lo,hi}=yRange(st),Wd=st.b-st.a,Ht=hi-lo,s=Math.min(230/Wd,140/Ht),hp=44/s;
  return{lo,hi,s,Pyl:hi+hp,hp};
}
function plateTheta(st,ss){const g=plateGeom(st),v=st.ex;return -Math.PI/2-Math.atan2(v.y-g.Pyl,v.x-ss.ax)}
function drawCurve(st,ss){
  const sailing=S.anim&&S.anim.k==='sail',g=plateGeom(st),PX=X0+(sailing?pose().dx:0),PY0=196,P_Y=PY0+ss.lower;
  const tt=plateTheta(st,ss);ss.w+=(-0.07*(ss.th-tt)-0.07*ss.w);ss.th+=ss.w;
  // altura de descenso objetivo
  if(ss.done){const goal=DECK-(PY0+g.s*(g.Pyl-g.lo))-1;ss.lower+=(goal-ss.lower)*.05}
  const th=ss.th,c=Math.cos(th),sn=Math.sin(th);
  const tr=(x,y)=>{const u=x-ss.ax,v=y-g.Pyl;return[PX+g.s*(u*c-v*sn),P_Y-g.s*(u*sn+v*c)]};
  // cable
  if(!sailing){ctx.strokeStyle=OUT;ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(PX,-6);ctx.lineTo(PX,P_Y-14);ctx.stroke()}
  // placa
  const N=60,top=[],bot=[];for(let i=0;i<=N;i++){const x=st.a+(st.b-st.a)*i/N;top.push(tr(x,st.f(x)));bot.push(tr(x,st.g(x)))}
  ctx.beginPath();top.forEach(([x,y],i)=>ctx[i?'lineTo':'moveTo'](x,y));bot.reverse().forEach(([x,y])=>ctx.lineTo(x,y));ctx.closePath();
  ctx.fillStyle='#f7922b';ctx.fill();ctx.strokeStyle=OUT;ctx.lineWidth=4;ctx.lineJoin='round';ctx.stroke();
  // eslingas rígidas
  const e=(st.b-st.a)*0.16,x1=clamp(ss.ax-e,st.a,st.b),x2=clamp(ss.ax+e,st.a,st.b);
  ctx.lineWidth=4;ctx.beginPath();[x1,x2].forEach(x=>{const[a,b]=tr(ss.ax,g.Pyl),[p,q]=tr(x,st.f(x));ctx.moveTo(a,b);ctx.lineTo(p,q)});ctx.stroke();
  // ancla
  const[ax_,ay_]=tr(ss.ax,g.Pyl);ctx.fillStyle='#b97a3d';ctx.lineWidth=4;ctx.beginPath();ctx.arc(ax_,ay_,15,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='#f5c15a';ctx.beginPath();ctx.arc(ax_,ay_,6,0,7);ctx.fill();ctx.lineWidth=3;ctx.stroke();
  // CG si ya calculado
  if(ss.calcOK){const[cx,cy]=tr(st.ex.x,st.ex.y);cgDot(cx,cy,true)}
  // vertical de gancho
  if(!ss.done&&!S.anim){ctx.setLineDash([5,6]);ctx.strokeStyle='rgba(22,48,90,.45)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(PX,P_Y);ctx.lineTo(PX,P_Y+g.s*(g.Pyl-g.lo)+20);ctx.stroke();ctx.setLineDash([])}
  const deg=th*180/Math.PI;ss.deg=deg;
}

      pts.map(p=>`<tr><td>${fmtP(p.m,isP?0:3)}</td><td>${fmtP(p.x,isP?0:2)}</td>${uy?`<td>${fmtP(p.y,1)}</td>`:''}<td>${fmtP(p.m*p.x,isP?1:3)}</td>${uy?`<td>${fmtP(p.m*p.y,2)}</td>`:''}</tr>`).join('')+'</table>';
  }
  const Sx=pts.reduce((s,p)=>s+p.m*p.x,0),Sy=pts.reduce((s,p)=>s+p.m*p.y,0);
  h+=`x̄ = Σ${mn}x / Σ${mn} = ${fmt(Sx,2)} / ${fmt(c.M,isP?0:3)} = <b>${fmt(c.x)} m</b>`;
  if(uy)h+=`<br>ȳ = Σ${mn}y / Σ${mn} = ${fmt(Sy,2)} / ${fmt(c.M,0)} = <b>${fmt(c.y)} m</b>`;
  return h;
}

function pieceSVG(p,scale,flip,numbered){
  const w=p.W*scale,h=p.H*scale,col=COLS[p.ci];
  let dots='';if(numbered)p.parts.forEach((q,i)=>{const x=(flip?p.W-q.c[0]:q.c[0])*scale,y=(p.H-q.c[1])*scale;dots+=`<circle cx="${x}" cy="${y}" r="8" fill="${q.sign<0?'#e5472e':'#16305a'}" stroke="#fff" stroke-width="2"/><text x="${x}" y="${y+4}" font-size="11" font-weight="700" text-anchor="middle" fill="#fff">${i+1}</text>`});
  const m=numbered?20:6;
  return`<svg viewBox="${-m} ${-m} ${w+2*m} ${h+2*m}" preserveAspectRatio="xMidYMid meet"><path d="${pathD(p,flip)}" transform="scale(${scale})" fill="${col[0]}" stroke="${OUT}" stroke-width="${3/scale}" stroke-linejoin="round" fill-rule="evenodd"/>${dots}${numbered?`<text x="-14" y="${h+16}" font-size="11" fill="${OUT}" font-weight="600">O</text>`:''}</svg>`;
}
function shapesPanel(st){const ss=SS();

     (q.solved?(q.placed?'<span class="mini g" style="cursor:default">en cubierta</span>':`<button class="mini o" data-act="pick" data-id="${i}">Izar</button>`):`<button class="mini" data-act="calc" data-i="${i}">🧮 Calcular</button>`)+
     (q.solved&&!q.placed?` <button class="mini g" data-act="flip" data-i="${i}">↔ Voltear</button>`:'')+`</div></div>`;
    if(ss.calc===i&&!q.solved){
      h+=`<div class="calc"><b>Centroide de «${p.name}»</b> (origen O en la esquina inferior izquierda)${pieceSVG(p,40,false,true)}
       <table><tr><th>#</th><th>Parte</th><th>A (m²)</th><th>x̄ᵢ</th><th>ȳᵢ</th></tr>${p.parts.map((q,k)=>`<tr><td>${k+1}</td><td>${q.name}</td><td>${q.sign<0?'−':''}${fmt(q.A,3)}</td><td>${fmt(q.c[0],3)}</td><td>${fmt(q.c[1],3)}</td></tr>`).join('')}</table>

  });
  const solvedAll=ss.ps.every(q=>q.solved);
  h+=`<div class="goal">🎯 Objetivo: x̄* = ${fmt(st.target)} m (centro de gravedad del conjunto)</div>
  <div class="lbl">Cálculo en vivo <label><input type="checkbox" data-act="guide" ${S.guide?'checked':''}> mostrar tabla</label></div><div id="ro" class="ro"></div>
  <div class="btns"><button class="btn ghost" data-act="reset">↺ Reiniciar</button></div>`;

function mcqOptions(st){
  const h=st.G==='0'?st.F:`(${st.F}) − (${st.G})`,lim=`∫[${st.a} → ${st.b}]`;
  const f2=st.G==='0'?`(${st.F})²`:`[(${st.F})² − (${st.G})²]`;
  return[ {t:`${lim}  x · ${st.G==='0'?`(${st.F})`:`[${h}]`} dx`,ok:true,why:''},
          {t:`${lim}  ${st.G==='0'?`(${st.F})`:`[${h}]`} dx`,ok:false,why:'Eso suma las franjas sin ponderar por su posición: es el <b>área A</b>.'},
          {t:`${lim}  ½ · ${f2} dx`,ok:false,why:'Eso pesa por la altura media de cada franja: es el momento respecto al eje x, <b>M<sub>x</sub></b>.'},
          {t:`${lim}  x² · ${st.G==='0'?`(${st.F})`:`[${h}]`} dx`,ok:false,why:'El brazo de palanca de la franja es x, no x². Cada franja pesa (f − g)·dx y se multiplica por x.'}];
}
function curvePanel(st){const ss=SS(),opts=mcqOptions(st);
  const mcq=ss.shuffle.map(i=>{const o=opts[i];const cls=ss.mcq===i?(o.ok?'ok':'no'):'';return`<button class="opt ${cls}" data-act="mcq" data-i="${i}">${o.t}</button>`}).join('');
  const inp=(id,l)=>`<label>${l} = <input type="text" id="${id}" inputmode="decimal"></label>`;
  return`<div class="eq">${st.label}</div>
  <div class="lbl"><span>1 · ¿Qué integral da el momento M<sub>y</sub>?</span></div>${mcq}
  <div class="${ss.mcq!==null&&opts[ss.mcq].ok?'':'locked'}">
   <div class="lbl">2 · Calcula (fracción o decimal)</div>
   <div class="row2">${inp('iA','A')} ${inp('iMy','M<sub>y</sub>')} ${inp('iMx','M<sub>x</sub>')}</div>
   <div class="row2" style="margin-top:6px">${inp('ix','x̄ = M<sub>y</sub>/A')} ${inp('iy','ȳ = M<sub>x</sub>/A')}</div>
   <div class="btns"><button class="btn blue" data-act="check3">Comprobar</button><button class="btn ghost" data-act="hint3">💡 Pista</button></div></div>

</div>`;
}

    if(st.type==='points'){const q=ss.queue.find(q=>q.uid===d.id);ss.held=ss.held&&ss.held.uid===d.id?null:q}

  reset(){delete S.ss[S.si];delete S.done[S.si];renderPanel()},
  next(){if(S.si<stages.length-1){acts.stage({i:S.si+1})}else setFB('🏆 <b>¡Misión cumplida!</b> Completaste todas las etapas del prototipo.','good')},
  verify(){
    const st=stages[S.si],ss=SS(),pts=points();
    if(st.type==='points'&&ss.queue.length)return setFB('Sube <b>todos</b> los contenedores antes de zarpar.','info');
    if(st.type==='shapes'&&ss.ps.some(q=>!q.placed))return setFB('Coloca <b>las tres piezas</b> en cubierta antes de zarpar.','info');
    const c=cmOf(pts),tol=0.06,isP=st.type==='points',xt=isP?st.target.x:st.target;
    const dx=c.x-xt,dy=isP&&st.useY?c.y-st.target.y:0,ok=Math.abs(dx)<=tol&&Math.abs(dy)<=tol;
    if(ok){S.done[S.si]=true;renderPanel();

    const msg=`💥 Centro de masa en x̄ = <b>${fmt(c.x)} m</b>${isP&&st.useY?`, ȳ = <b>${fmt(c.y)} m</b>`:''} · objetivo ${isP&&st.useY?`(${fmt(xt)}; ${fmt(st.target.y)})`:fmt(xt)} m`;
    setFB('');startFail(dx>=0?1:-1,msg);
  },
  calc(d){SS().calc=+d.i;renderPanel()},
  check2(d){const st=stages[S.si],ss=SS(),p=st.pieces[+d.i],ix=$('#ix'),iy=$('#iy'),vx=num(ix.value),vy=num(iy.value);
    const okx=Math.abs(vx-p.cx)<=0.03,oky=Math.abs(vy-p.cy)<=0.03;ix.className=okx?'ok':'no';iy.className=oky?'ok':'no';
    if(okx&&oky){ss.ps[+d.i].solved=true;ss.calc=null;ss.held={pid:+d.i};SFX.ding();renderPanel();setFB(`✅ «${p.name}»: (${fmt(p.cx)}; ${fmt(p.cy)}) m`,'good',2200)}
    else{SFX.wrong();setFB(`x̄ ${okx?'✓':'✗'} · ȳ ${oky?'✓':'✗'}`,'bad',2500)}},
  hint2(d){const p=stages[S.si].pieces[+d.i];const t=k=>p.parts.map(q=>`${q.sign<0?'−':'+'} ${fmt(q.A,3)}·${fmt(q.c[k],3)}`).join(' ').replace(/^\+ /,'');
    const Aexp=p.parts.map(q=>`${q.sign<0?'−':'+'} ${fmt(q.A,3)}`).join(' ').replace(/^\+ /,'');
    setFB(`<b>Pista</b><br>A = ${Aexp} = ${fmt(p.A,3)}<br>x̄ = (${t(0)}) / ${fmt(p.A,3)}<br>ȳ = (${t(1)}) / ${fmt(p.A,3)}<br>Resultado: (${fmt(p.cx)}; ${fmt(p.cy)})`,'info')},
  mcq(d){const st=stages[S.si],ss=SS(),o=mcqOptions(st)[+d.i];ss.mcq=+d.i;renderPanel();
    o.ok?SFX.ding():SFX.wrong();setFB(o.ok?'✅ Correcto':'❌ '+o.why,o.ok?'good':'bad',o.ok?2000:5000)},
  check3(d){const st=stages[S.si],ss=SS(),v=st.ex,ids=['iA','iMy','iMx','ix','iy'],keys=['A','My','Mx','x','y'];
    let all=true;ids.forEach((id,i)=>{const el=$('#'+id),ok=close(num(el.value),v[keys[i]]);el.className=ok?'ok':'no';all=all&&ok});
    if(all){ss.calcOK=true;const keep=ids.map(id=>$('#'+id).value);renderPanel();ids.forEach((id,i)=>{const el=$('#'+id);el.value=keep[i];el.className='ok'});
      SFX.ding();setFB(`✅ Centroide (${fmt(v.x)}; ${fmt(v.y)}) m`,'good',2200)}
    else{SFX.wrong();setFB('Hay valores que no coinciden','bad',2500)}},
  hint3(){const st=stages[S.si],e=st.exs;
    setFB(`<b>Pista</b> (resultados exactos)<br>A = ∫(f − g)dx = ${e.A}<br>M<sub>y</sub> = ∫x(f − g)dx = ${e.My}<br>M<sub>x</sub> = ∫½(f² − g²)dx = ${e.Mx}<br>x̄ = M<sub>y</sub>/A = ${e.x} · ȳ = M<sub>x</sub>/A = ${e.y}`,'info')},
  lift(){const st=stages[S.si],ss=SS(),err=Math.abs(ss.ax-st.ex.x),tol=0.03*(st.b-st.a);
    if(ss.done||S.anim||!ss.calcOK)return;
    if(err<=tol){const idx=S.si;ss.ax=st.ex.x;ss.done=true;S.done[S.si]=true;renderPanel();SFX.ding();setFB('✅ ¡Cuelga nivelada!','good',2400);
      setTimeout(()=>{if(S.si===idx&&!S.anim)startSail()},2800)}}
};

  items.forEach(it=>s+=box(it,false));if(o.ghost)s+=box(o.ghost,true);

function exampleFor(p){return p.parts.some(q=>q.sign<0)?exHole():p.parts.some(q=>q.poly.length===41)?exSemi():p.parts.some(q=>q.poly.length===3)?exTri():exStep()}
function demoShapes(){return[
  {t:'1 · Descompón en figuras simples',html:`<div style="max-width:300px;margin:auto">${pieceSVG(exStep(),40,false,true)}</div><p>Ejemplo (no es una pieza del juego): una placa en escalón se corta en <b>dos rectángulos</b>. Los puntos numerados marcan el centroide de cada parte (el centro de un rectángulo).</p>`},
  {t:'2 · Tabla: área y centroide de cada parte',html:workedHTML(exStep())+'<p>x̄ = <b>Σ(Aᵢ·x̄ᵢ) / ΣAᵢ</b> y lo mismo con y. Es el mismo promedio ponderado del Nivel 1, pero con áreas en lugar de masas.</p>'},
  {t:'3 · Los agujeros restan',html:workedHTML(exHole())+'<p>El agujero se trata como una parte de <b>área negativa</b>: baja el área total y empuja el centroide al lado contrario.</p>'},
  {t:'4 · Ya tienes el centroide: ahora colócala',html:'<p>Cada pieza se comporta como una masa puntual en su centroide, con masa = área (densidad 1 t/m²).<br>Posición global: <b>x = L + x̄ᵢ</b>, donde L es el borde izquierdo donde la sueltas.<br>Si la volteas, x̄ᵢ pasa a ser <b>ancho − x̄ᵢ</b>.<br>Luego el centro de gravedad del conjunto es <b>Σ(Aᵢ·x) / ΣAᵢ</b>: igual que en el Nivel 1.</p><p>Calcula cada centroide (puedes pedir una pista: te mostrará un ejemplo parecido, no la respuesta) y busca el orden y los huecos que dejen x̄ en la bandera.</p>'}
]}
function curveSVG(){
  const sx=60,sy=34,X=20,Y=170,pt=x=>`${X+x*sx},${Y-x*x*sy}`;let pts=[];for(let i=0;i<=40;i++)pts.push(pt(2*i/40));
  return`<svg viewBox="0 0 220 190" class="dsvg" style="max-width:260px"><polygon points="${X},${Y} ${pts.join(' ')} ${X+2*sx},${Y}" fill="#f7922b" stroke="#16305a" stroke-width="3"/>
  <rect x="${X+0.9*sx}" y="${Y-1*sy}" width="6" height="${sy}" fill="#16305a" opacity=".55"/><text x="${X+sx+12}" y="${Y-8}" font-size="11" fill="#16305a" font-weight="700">franja dx</text>
  <circle cx="${X+1.5*sx}" cy="${Y-1.2*sy}" r="6" fill="#fff" stroke="#16305a" stroke-width="3"/><text x="${X+2*sx+4}" y="${Y-5}" font-size="11" fill="#16305a">x</text><text x="${X-2}" y="22" font-size="11" fill="#16305a">y = x²</text></svg>`;
}
const curveWorked=()=>`<p><i>Ejemplo con otra curva: región bajo <b>y = x²</b> entre x = 0 y x = 2.</i></p>
  <table class="dt"><tr><td>Área</td><td>A = ∫₀² x² dx = 8/3</td></tr><tr><td>Momento M<sub>y</sub> (brazo x)</td><td>∫₀² x·x² dx = ∫ x³ dx = 4</td></tr><tr><td>Momento M<sub>x</sub> (franja a media altura)</td><td>∫₀² ½(x²)² dx = ½∫ x⁴ dx = 16/5</td></tr><tr><td>x̄ = M<sub>y</sub>/A</td><td>4 / (8/3) = 3/2</td></tr><tr><td>ȳ = M<sub>x</sub>/A</td><td>(16/5) / (8/3) = 6/5</td></tr></table>`;
function demoCurve(){return[
  {t:'1 · Corta la placa en franjas',html:curveSVG()+'<p>Cada franja de ancho dx pesa <b>(f − g)·dx</b> (su altura por dx), está a distancia <b>x</b> del eje y y su centro queda a <b>media altura</b> ½(f + g). Es el Nivel 1 con infinitas masas muy pequeñas.</p>'},
  {t:'2 · Suma con integrales',html:curveWorked()+'<p>Mismas ideas: área = Σ masas, momento = Σ (masa × brazo).</p>'},
  {t:'3 · Ubica la argolla sobre x̄',html:'<p>El gancho debe quedar <b>justo encima del centro de gravedad</b>. Si la argolla está a un lado, el peso crea un momento y la placa gira hasta que x̄ queda bajo el gancho: la verás inclinada.</p><p>En el juego: elige la integral correcta de M<sub>y</sub>, calcula A, M<sub>y</sub>, M<sub>x</sub>, x̄ y ȳ de <b>tu</b> región, y mueve la argolla a x = x̄. Con 💡 Pista verás este mismo tipo de ejemplo.</p>'}
]}
function openDemo(type){showModal('📖 Demo guiada',type==='points'?demoPoints():type==='shapes'?demoShapes():demoCurve())}
function maybeDemo(){const t=stages[S.si].type;S.seen=S.seen||{};if(!S.seen[t]){S.seen[t]=1;openDemo(t)}}
acts.demo=()=>openDemo(stages[S.si].type);
acts.hint2=d=>{const p=stages[S.si].pieces[+d.i],ex=exampleFor(p);
  showModal('💡 Pista: ejemplo resuelto',[{t:`Así se hace con «${ex.name}» (otra figura)`,html:workedHTML(ex)+'<p><b>Ahora tú:</b> haz lo mismo con tu pieza: llena la tabla de partes, suma A·x̄ᵢ y A·ȳᵢ, y divide entre el área total.'+(p.parts.some(q=>q.sign<0)?' No olvides que el agujero resta.':'')+'</p>'}])};
acts.hint3=()=>showModal('💡 Pista: ejemplo resuelto',[{t:'Así se hace con otra región',html:curveSVG()+curveWorked()+'<p><b>Ahora tú:</b> sigue los mismos pasos con tu región (recuerda f − g y los límites de integración).</p>'}]);
const _stage=acts.stage;acts.stage=d=>{if(MD){modal.classList.remove('on');MD=null}_stage(d);S.ang=0;setFB('')};   // la demo se abre solo a pedido y siempre es la del nivel actual
acts.mute=()=>{S.mute=!S.mute;renderPanel()};
const _pick=acts.pick;acts.pick=d=>{if(S.anim)return;SFX.pick();_pick(d)};

window.G={S,stages,cmOf,points,simp,SS,acts};
(function loop(ts){T=ts/1000;draw();drawParticles();requestAnimationFrame(loop)})(0);
renderPanel();
</script>
</body>
</html>
